name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # 每天自动运行一次
  workflow_dispatch:       # 手动触发

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: your-github-username
          template: classic
          base: header, activity, community, repositories, metadata

          # 插件配置
          plugin_lines: yes                # 代码提交曲线
          plugin_followup: yes             # 待办/issue跟进
          plugin_stars: yes                # Star过的项目
          plugin_topics: yes               # 关注的主题
          plugin_reactions: yes            # 互动反应
          plugin_achievements: yes         # 成就徽章
          plugin_languages: yes            # 语言统计
          plugin_contributors: yes         # 仓库贡献者
          plugin_calendar: yes             # 活动日历
          plugin_activity: yes             # 最近活动
          plugin_projects: yes             # GitHub Projects
          plugin_repositories: yes         # 仓库详情
          plugin_support: yes              # 赞助信息
          plugin_tweets: yes               # 最近推文（需要Twitter API）
          plugin_music: yes                # 最近听歌（Spotify API）
          plugin_code: yes                 # 代码片段展示
